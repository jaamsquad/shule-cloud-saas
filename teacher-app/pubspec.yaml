name: shulecloud_teacher
description: ShuleCloud Teacher — classes, attendance, gradebook, lesson plans & school life.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts + PDF
  fl_chart: ^0.68.0
  pdf: ^3.11.1
  printing: ^5.13.1

  # Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # Device
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  google_sign_in: ^6.2.1
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  signature: ^5.5.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ShuleCloud Teacher brand-mark launcher icon.
flutter_launcher_icons:
  android: "ic_launcher"          # overwrite the default ic_launcher from `flutter create`
  ios: false                      # CI builds Android only (no ios/ folder → generation crashes)
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A0E52"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
