name: shulecloud_driver
description: ShuleCloud Driver — Smart School Transport app for bus drivers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & maps (OpenStreetMap — no API key, no billing)
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

  # Device / permissions
  permission_handler: ^11.3.1
  battery_plus: ^6.0.1

  # Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # QR / camera
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ShuleCloud brand-mark launcher icon (driver photo mark, blue gradient).
# CI runs flutter_launcher_icons after `flutter create` to generate all densities.
flutter_launcher_icons:
  android: "ic_launcher"          # overwrite the default ic_launcher from `flutter create`
  ios: false                      # CI builds Android only (no ios/ folder → generation crashes)
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#10245C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
