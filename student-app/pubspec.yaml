name: shulecloud_student
description: ShuleCloud Student — results, timetable, assignments, notes, fees & wallet.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ShuleCloud Student brand-mark launcher icon.
flutter_launcher_icons:
  android: "ic_launcher"          # overwrite the default ic_launcher from `flutter create`
  ios: false                      # CI builds Android only (no ios/ folder → generation crashes)
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F7A40"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
