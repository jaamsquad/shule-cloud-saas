name: Build Student App APK

# Builds the ShuleCloud Student Flutter app in the cloud → installable APK artifact.
# No Flutter SDK needed locally. Mirrors the proven driver-app/parent-app workflow.

on:
  push:
    branches: [main]
    paths:
      - "student-app/**"
      - ".github/workflows/student-app.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native scaffolding (android/) without touching lib/
        run: flutter create --platforms=android --org com.shulecloud .

      - name: Restore custom AndroidManifest (permissions + queries)
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml.custom ]; then
            cp android/app/src/main/AndroidManifest.xml.custom android/app/src/main/AndroidManifest.xml
          fi

      - name: Enable core library desugaring (flutter_local_notifications)
        run: |
          set -e
          APP_GRADLE=""
          if [ -f android/app/build.gradle.kts ]; then APP_GRADLE=android/app/build.gradle.kts; fi
          if [ -f android/app/build.gradle ]; then APP_GRADLE=android/app/build.gradle; fi
          echo "Patching $APP_GRADLE"
          if [[ "$APP_GRADLE" == *.kts ]]; then
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
              perl -0pi -e 's/(android\s*\{)/$1\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }/' "$APP_GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaring" "$APP_GRADLE"; then
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$APP_GRADLE"
            fi
          else
            if ! grep -q "coreLibraryDesugaringEnabled" "$APP_GRADLE"; then
              perl -0pi -e 's/(android\s*\{)/$1\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }/' "$APP_GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaring" "$APP_GRADLE"; then
              perl -0pi -e 's/(dependencies\s*\{)/$1\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"/' "$APP_GRADLE"
            fi
          fi

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons (ShuleCloud Student brand mark)
        run: |
          set -e
          echo "Icon source files:"
          ls -l assets/icon/
          # Run the generator (fail loudly if it errors — do NOT mask with '|| true').
          dart run flutter_launcher_icons
          echo "Generated mipmap icons:"
          find android/app/src/main/res -name "ic_launcher*.png" -o -name "ic_launcher*.xml" | sort
          # Guard: a real launcher PNG must exist, else we'd ship the default Flutter icon.
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build debug APK (installable without a signing key)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shulecloud-student-apk
          path: student-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
