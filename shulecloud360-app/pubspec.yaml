name: shulecloud_360
description: ShuleCloud 360 — one app for everyone at school (admin, finance, teachers, students, parents).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/apps.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_brand.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/icon_brand.png"
    background_color: "#5C67F2"
    theme_color: "#5C67F2"
